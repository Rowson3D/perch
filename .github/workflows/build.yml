name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint and format check
        run: |
          pip install ruff
          ruff check .
          ruff format --check .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Agent compiles on Python 3.8+ syntax
        run: python -m py_compile agent/gpu_agent.py

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build executables
        shell: pwsh
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: gpu-watch-windows
          path: dist/*.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create $env:GITHUB_REF_NAME
          dist/GpuWatch.exe dist/gpu-agent.exe
          agent/gpu_agent.py agent/install_agent_linux.sh agent/install_agent_windows.ps1
          --title "GPU Watch $env:GITHUB_REF_NAME" --generate-notes
